<header class="container py-5 text-center">
  <h1 class="display-5 fw-bold">Desarrollo de Sitios Web</h1>
  <p class="lead text-secondary">Espacio académico dedicado a la creación y estructuración de aplicaciones web SPA profesionales, aplicando los estándares vigentes de Angular 20.</p>
</header>
<section class="container pb-5">
  <div class="row g-4">
    @for (tec of tecnologias; track tec.nombre) {
      <div class="col-12 col-md-4">
        <div class="card h-100 text-center shadow-sm border-0">
          <div class="card-body p-4">
            <i class="bi {{ tec.icono }} fs-1 text-primary"></i>
            <h2 class="h5 mt-3 fw-bold">{{ tec.nombre }}</h2>
            <p class="mb-0 text-muted">{{ tec.descripcion }}</p>
          </div>
        </div>
      </div>
    }
  </div>
